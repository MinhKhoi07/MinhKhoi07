name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Chạy mỗi ngày lúc 0h UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVG & GIF
        uses: Platane/snk@v3
        with:
          github_user_name: MinhKhoi07
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif
          palette: github-dark  # Đổi màu ô trống thành đen/xám đậm giống theme dark

      - name: Push animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
